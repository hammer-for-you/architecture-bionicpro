server:
  port: 8000

keycloak:
  url: ${KEYCLOAK_HOST:http://localhost}:${KEYCLOAK_PORT:8080}

spring:
  application:
    name: bionicpro-backend
  datasource:
    url: jdbc:clickhouse:http://${DB_HOST:localhost}:${DB_PORT:9123}/${DB_DATABASE:bionicpro}
    username: ${DB_USERNAME:airflow}
    password: ${DB_PASSWORD:airflow}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.url}/realms/reports-realm
          jwk-set-uri: ${keycloak.url}/realms/reports-realm/protocol/openid-connect/certs